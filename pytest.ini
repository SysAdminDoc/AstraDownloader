[pytest]
qt_api = pyside6
testpaths = astra_downloader
python_files = test_*.py
# astra_downloader/conftest.py sets QT_QPA_PLATFORM before Qt is imported. Set
# ASTRA_DOWNLOADER_ALLOW_ONSCREEN=1 only for an intentional display-backed run.
# Keep pytest's session workspace inside the ignored project build tree. A
# stale protected directory under the account-wide temp root can otherwise
# fail tmpdir cleanup after all tests pass and hide the summary line.
# `-n auto` because the suite is CPU-bound and embarrassingly parallel: 140 s
# serially against ~45 s across every core. It needs pytest-xdist, and it
# needs the suite to be order-independent — the probe caches and the yt-dlp
# activity registry are process-wide, and conftest.py keeps both from
# carrying state between tests. Add `-p no:xdist` for a serial run when
# debugging one test's interaction with another.
addopts = --basetemp=build/pytest -n auto
# pytest-asyncio is pulled in as a transitive dep but the downloader tests
# themselves are entirely synchronous. Pin the future-default loop scope so
# the PytestDeprecationWarning ("The configuration option ...
# asyncio_default_fixture_loop_scope is unset") doesn't pollute every test
# run. The value matches the upcoming default in pytest-asyncio 1.0.
asyncio_default_fixture_loop_scope = function
